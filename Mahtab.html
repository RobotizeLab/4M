<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math Adventure</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Comic Sans MS","Chalkboard SE",sans-serif;background:linear-gradient(#7fd8ff,#c9f0ff 60%,#b8f08a 60%);display:flex;align-items:center;justify-content:center;overflow:hidden}
.cloud{position:fixed;font-size:70px;animation:drift 30s linear infinite;opacity:.9}
@keyframes drift{from{transform:translateX(-150px)}to{transform:translateX(110vw)}}
.card{position:relative;z-index:2;background:#fff;border:6px solid #ffb703;border-radius:32px;padding:24px;width:min(640px,94vw);max-height:98vh;overflow:auto;text-align:center;box-shadow:0 12px 0 #fb8500,0 20px 40px rgba(0,0,0,.25)}
h1{margin:0 0 8px;color:#e63946;font-size:2.4rem}
.btn{font:inherit;font-size:1.5rem;font-weight:bold;color:#fff;background:#06d6a0;border:none;border-radius:20px;padding:12px 32px;cursor:pointer;box-shadow:0 6px 0 #049a75;margin:10px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #049a75}
.home{background:#8d99ae;box-shadow:0 6px 0 #5c677d}
.hud{display:flex;justify-content:space-between;font-size:1.1rem;font-weight:bold;color:#444;margin-bottom:8px;gap:6px}
.bar{height:20px;background:#eee;border-radius:12px;overflow:hidden;margin-bottom:14px}
.bar div{height:100%;width:100%;background:#06d6a0;transition:width .1s linear,background .3s}
.question{display:flex;align-items:center;justify-content:center;gap:10px;font-size:3.2rem;font-weight:bold;margin:10px 0}
.num{background:#ffd6e0;color:#d00060;border-radius:20px;padding:4px 22px;min-width:100px}
.num.b{background:#d6ecff;color:#0062d0}
.op{color:#fb8500}
.apples{font-size:1.1rem;min-height:2.6rem;word-break:break-all;line-height:1.2}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
.opt{font:inherit;font-size:2.2rem;font-weight:bold;color:#fff;border:none;border-radius:22px;padding:16px;cursor:pointer;box-shadow:0 7px 0 rgba(0,0,0,.25);transition:transform .1s}
.opt:hover{transform:scale(1.05)}
.opt:nth-child(1){background:#ef476f}.opt:nth-child(2){background:#118ab2}.opt:nth-child(3){background:#9b5de5}.opt:nth-child(4){background:#f77f00}
.opt.right{background:#06d6a0!important;animation:pop .4s}
.opt.wrong{background:#555!important;animation:shake .4s}
@keyframes pop{50%{transform:scale(1.2)}}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.msg{min-height:2.2rem;font-size:1.3rem;font-weight:bold;margin-top:12px}
.hidden{display:none}
.big{font-size:5rem}
.stars{font-size:3rem}
.lvls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.lvl{font:inherit;font-weight:bold;font-size:1.15rem;color:#fff;border:none;border-radius:18px;padding:10px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.25);line-height:1.3}
.lvl small{display:block;font-size:.8rem;font-weight:normal;opacity:.95}
.lvl:hover{transform:scale(1.04)}
.lvl:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.lvl:last-child:nth-child(odd){grid-column:span 2}
.ops .lvl{font-size:1.4rem;padding:18px 10px}
.ops .lvl:last-child:nth-child(odd){grid-column:auto}
.ops .lvl span{font-size:2.6rem;display:block}
a.lvl{display:block;text-decoration:none}
.ops.more .lvl{font-size:1.15rem;padding:12px 6px}
.ops.more .lvl span{font-size:2rem}
.snd{position:fixed;top:12px;right:12px;z-index:5;display:flex;gap:8px}
.snd button{font-size:1.6rem;width:52px;height:52px;border-radius:50%;border:4px solid #ffb703;background:#fff;cursor:pointer;box-shadow:0 4px 0 #fb8500}
.snd button.off{opacity:.45;filter:grayscale(1)}
</style>
</head>
<body>
<div class="cloud" style="top:5%">☁️</div>
<div class="cloud" style="top:20%;animation-delay:-12s">☁️</div>
<div class="cloud" style="top:35%;animation-delay:-22s">☁️</div>

<div class="snd"><button id="sfxBtn" title="Sound effects" onclick="toggleSfx()">🔊</button><button id="musBtn" title="Music" onclick="toggleMusic()">🎵</button></div>
<div class="card">
  <div id="start">
    <div class="big">🦄🧮</div>
    <h1>Math Adventure!</h1>
    <p style="font-size:1.15rem;margin:6px"><b>What do you want to practice?</b></p>
    <div class="lvls ops" id="ops"></div>
    <div class="lvls ops more">
      <a class="lvl" style="background:#ef476f" href="MahtabLearn.html#spelling"><span>✏️</span>Spelling</a>
      <a class="lvl" style="background:#118ab2" href="MahtabLearn.html#sentences"><span>📝</span>Sentences</a>
      <a class="lvl" style="background:#9b5de5" href="MahtabLearn.html#language"><span>📖</span>Language Arts</a>
      <a class="lvl" style="background:#f77f00" href="MahtabLearn.html#geometry"><span>📐</span>Geometry</a>
      <a class="lvl" style="background:#06d6a0" href="MahtabLearn.html#science"><span>🔬</span>Science</a>
      <a class="lvl" style="background:#3a86ff" href="MahtabLearn.html#social"><span>🌎</span>Social Studies</a>
    </div>
  </div>

  <div id="levels" class="hidden">
    <h1 id="optitle"></h1>
    <p style="font-size:1.15rem;margin:6px">10 questions. <b>Choose your level:</b></p>
    <div class="lvls" id="lvls"></div>
    <button class="btn home" onclick="show('start')">⬅ Back</button>
  </div>

  <div id="game" class="hidden">
    <div class="hud"><span>Q <span id="qn">1</span>/10</span><span id="lvname"></span><span>⏱ <span id="time">30</span>s</span><span>⭐ <span id="score">0</span></span></div>
    <div class="bar"><div id="bar"></div></div>
    <div class="question"><span class="num" id="a"></span><span class="op" id="sym">+</span><span class="num b" id="b"></span><span class="op">=</span><span>❓</span></div>
    <div class="apples" id="apples"></div>
    <div class="opts" id="opts"></div>
    <div class="msg" id="msg"></div>
  </div>

  <div id="end" class="hidden">
    <div class="big" id="trophy">🏆</div>
    <h1>Game Over!</h1><div id="endlv" style="font-size:1.2rem;font-weight:bold"></div>
    <div class="stars" id="stars"></div>
    <p style="font-size:2rem;margin:8px">You scored <b id="final"></b> / 10</p>
    <p style="font-size:1.3rem" id="comment"></p>
    <button class="btn" onclick="startGame(cur)">🔄 Play Again</button>
    <button class="btn home" onclick="chooseOp(op)">🎚 Levels</button>
    <button class="btn home" onclick="show('start')">🏠 Home</button>
  </div>
</div>

<script>
const TOTAL=10;
const $=id=>document.getElementById(id);
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[rnd(0,a.length-1)];
const swap=(a,b,r)=>Math.random()<.5?[a,b,r]:[b,a,r];

const LV=[
 {name:"Very Easy",icon:"🐣",color:"#8ac926"},
 {name:"Easy",icon:"🐥",color:"#06d6a0"},
 {name:"Medium",icon:"🦊",color:"#118ab2"},
 {name:"Intermediate",icon:"🐯",color:"#9b5de5"},
 {name:"Advanced",icon:"🦁",color:"#f77f00"},
 {name:"Outstanding",icon:"🐲",color:"#ef476f"},
 {name:"Genius",icon:"🦄",color:"#3a0ca3"}
];

// generators return [a, b, answer]
function addG(lo,hi,lo2,hi2,max,min,carry){
  return()=>{for(;;){
    const a=rnd(lo,hi),b=rnd(lo2,hi2),s=a+b;
    if(s>max||s<min)continue;
    if(carry!==undefined&&((a%10+b%10)>=10)!==carry)continue;
    return swap(a,b,s);
  }};
}
function subG(lo,hi,lo2,hi2,borrow){
  return()=>{for(;;){
    const a=rnd(lo,hi),b=rnd(lo2,hi2);
    if(b>a)continue;
    if(borrow!==undefined&&((a%10)<(b%10))!==borrow)continue;
    return[a,b,a-b];
  }};
}
const mulT=(tables,lo,hi)=>()=>{const t=pick(tables),n=rnd(lo,hi);return swap(t,n,t*n)};
const mulR=(lo,hi,lo2,hi2,max)=>()=>{for(;;){const a=rnd(lo,hi),b=rnd(lo2,hi2);if(a*b<=max)return[a,b,a*b]}};
const divT=(tables,lo,hi)=>()=>{const t=pick(tables),n=rnd(lo,hi);return[t*n,t,n]};
const divR=(dlo,dhi,qlo,qhi,vlo,vhi)=>()=>{for(;;){const d=rnd(dlo,dhi),q=rnd(qlo,qhi),v=d*q;if(v>=vlo&&v<=vhi)return[v,d,q]}};

// times: seconds per question, for 3rd graders
const OPS={
 add:{name:"Addition",icon:"➕",sym:"+",color:"#06d6a0",levels:[
  {desc:"Up to 10",time:15,gen:addG(0,10,0,10,10,0)},
  {desc:"Up to 20",time:20,gen:addG(0,20,0,20,20,11)},
  {desc:"Up to 50",time:30,gen:addG(0,50,0,50,50,21)},
  {desc:"2-digit + 1-digit, up to 100",time:35,gen:addG(10,90,1,9,100,21)},
  {desc:"2-digit + 2-digit, no carrying",time:45,gen:addG(10,90,10,90,100,30,false)},
  {desc:"2-digit + 2-digit, with carrying",time:60,gen:addG(10,90,10,90,100,30,true)},
  {desc:"3-digit + 3-digit",time:90,gen:addG(100,999,100,999,2000,0)}]},
 sub:{name:"Subtraction",icon:"➖",sym:"−",color:"#118ab2",levels:[
  {desc:"Within 10",time:15,gen:subG(0,10,0,10)},
  {desc:"Within 20",time:20,gen:subG(11,20,1,20)},
  {desc:"Within 50",time:30,gen:subG(21,50,1,50)},
  {desc:"2-digit − 1-digit, up to 100",time:35,gen:subG(10,100,1,9)},
  {desc:"2-digit − 2-digit, no borrowing",time:45,gen:subG(20,99,10,99,false)},
  {desc:"2-digit − 2-digit, with borrowing",time:60,gen:subG(20,99,10,99,true)},
  {desc:"3-digit − 3-digit",time:90,gen:subG(100,999,100,999)}]},
 mul:{name:"Multiplication",icon:"✖️",sym:"×",color:"#f77f00",levels:[
  {desc:"Tables of 1, 2 and 10",time:15,gen:mulT([1,2,10],0,10)},
  {desc:"Tables of 3 and 5",time:20,gen:mulT([3,5],0,10)},
  {desc:"Tables of 4 and 6",time:25,gen:mulT([4,6],0,10)},
  {desc:"Tables of 7, 8 and 9",time:30,gen:mulT([7,8,9],0,10)},
  {desc:"All tables up to 12",time:30,gen:mulR(2,12,2,12,144)},
  {desc:"2-digit × 1-digit",time:50,gen:mulR(11,25,2,5,100)},
  {desc:"2-digit × 2-digit",time:90,gen:mulR(11,30,11,20,600)}]},
 div:{name:"Division",icon:"➗",sym:"÷",color:"#9b5de5",levels:[
  {desc:"Share by 1, 2 and 10",time:15,gen:divT([1,2,10],0,10)},
  {desc:"Share by 3 and 5",time:20,gen:divT([3,5],0,10)},
  {desc:"Share by 4 and 6",time:25,gen:divT([4,6],0,10)},
  {desc:"Share by 7, 8 and 9",time:30,gen:divT([7,8,9],0,10)},
  {desc:"All tables up to 12",time:30,gen:divR(2,12,2,12,4,144)},
  {desc:"2-digit ÷ 1-digit",time:50,gen:divR(2,9,10,19,20,99)},
  {desc:"3-digit ÷ 1-digit",time:75,gen:divR(2,9,12,111,100,999)}]}
};

let lastTick=-1, op="add", cur=0, LIMIT=30, q=0, score=0, ans=0, left=0, timer=null, locked=false;
const fruits=['🍎','🍓','🍌','🍇','🍊'];
const AudioCtx=window.AudioContext||window.webkitAudioContext;
let ac, sfxOn=true, musicOn=true, musicTimer=null, step=0;
function ctx(){try{ac=ac||new AudioCtx();if(ac.state!=='running')ac.resume();return ac}catch(e){return null}}
// Mobile unlock: must run inside a user gesture
let unlocked=false, silentEl=null;
function silentWavUrl(){
  const n=4410,b=new ArrayBuffer(44+n*2),v=new DataView(b);
  const w=(o,s)=>[...s].forEach((ch,i)=>v.setUint8(o+i,ch.charCodeAt(0)));
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,22050,true);v.setUint32(28,44100,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  return URL.createObjectURL(new Blob([b],{type:'audio/wav'}));
}
function unlockAudio(){
  const a=ctx();if(!a)return;
  try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  if(unlocked){return}
  try{
    const buf=a.createBuffer(1,1,22050),s=a.createBufferSource();
    s.buffer=buf;s.connect(a.destination);s.start(0);
  }catch(e){}
  try{
    // lets iOS play Web Audio even when the silent switch is on
    silentEl=new Audio(silentWavUrl());silentEl.loop=true;silentEl.volume=.01;
    const pr=silentEl.play();if(pr&&pr.catch)pr.catch(()=>{});
  }catch(e){}
  if(a.state==='running')unlocked=true;
}
['pointerdown','touchstart','touchend','click','keydown'].forEach(ev=>document.addEventListener(ev,unlockAudio,{passive:true}));
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(ac&&ac.state!=='running')ac.resume()}});
function tone(f,d,type='sine',vol=.15,delay=0){
  const a=ctx();if(!a)return;
  if(a.state!=='running'){a.resume();}
  const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05);
}
const N={C:523.25,D:587.33,E:659.25,G:783.99,A:880,C2:1046.5,E2:1318.5,G2:1568};
const sfx={
  click(){if(sfxOn)tone(700,.08,'triangle',.12)},
  correct(){if(!sfxOn)return;[N.C,N.E,N.G,N.C2].forEach((f,i)=>tone(f,.25,'triangle',.18,i*.09))},
  wrong(){if(!sfxOn)return;tone(300,.25,'sawtooth',.1);tone(200,.4,'sawtooth',.1,.18)},
  tick(){if(sfxOn)tone(1000,.06,'square',.06)},
  timeup(){if(!sfxOn)return;[500,400,300].forEach((f,i)=>tone(f,.3,'square',.09,i*.2))},
  fanfare(s){if(!sfxOn)return;const m=s>=2?[N.C,N.E,N.G,N.C2,N.G,N.C2,N.E2,N.G2]:s===1?[N.C,N.E,N.G,N.E,N.G]:[N.G,N.E,N.C];m.forEach((f,i)=>tone(f,.3,'triangle',.18,i*.13))}
};
// cheerful pentatonic loop
const SONG=[N.C,N.E,N.G,N.E,N.A,N.G,N.E,N.D,N.C,N.E,N.G,N.A,N.G,N.E,N.D,0];
function startMusic(){
  stopMusic();if(!musicOn)return;
  step=0;
  musicTimer=setInterval(()=>{const f=SONG[step++%SONG.length];if(f)tone(f/2,.28,'sine',.05)},330);
}
function stopMusic(){clearInterval(musicTimer);musicTimer=null}
function toggleSfx(){ctx();sfxOn=!sfxOn;$('sfxBtn').textContent=sfxOn?'🔊':'🔇';$('sfxBtn').classList.toggle('off',!sfxOn);sfx.click()}
function toggleMusic(){ctx();musicOn=!musicOn;$('musBtn').classList.toggle('off',!musicOn);
  if(musicOn&&!$('game').classList.contains('hidden'))startMusic();else stopMusic()}
document.addEventListener('click',e=>{if(e.target.closest('.lvl,.btn'))sfx.click()});
function show(id){clearInterval(timer);if(id!=='game')stopMusic();['start','levels','game','end'].forEach(s=>$(s).classList.toggle('hidden',s!==id))}
function buildOps(){
  $("ops").innerHTML=Object.entries(OPS).map(([k,o])=>`<button class="lvl" style="background:${o.color}" onclick="chooseOp('${k}')"><span>${o.icon}</span>${o.name}</button>`).join("");
}
function chooseOp(k){
  op=k;const O=OPS[k];
  $("optitle").textContent=O.icon+" "+O.name;
  $("lvls").innerHTML=O.levels.map((l,i)=>`<button class="lvl" style="background:${LV[i].color}" onclick="startGame(${i})">${LV[i].icon} ${LV[i].name}<small>${l.desc} · ${l.time}s</small></button>`).join("");
  show('levels');
}
function startGame(i){
  cur=i;LIMIT=OPS[op].levels[i].time;
  $("lvname").textContent=LV[i].icon+" "+LV[i].name;
  $("sym").textContent=OPS[op].sym;
  q=0;score=0;$('score').textContent=0;show('game');startMusic();next();
}

function hint(a,b){
  const f=fruits[rnd(0,4)];
  if(cur>1)return'';
  if(op==='add'&&a+b<=20)return f.repeat(a)+' ➕ '+f.repeat(b);
  if(op==='sub'&&a<=20)return f.repeat(a-b)+'🔸'.repeat(b)+'  (take away '+b+')';
  if(op==='mul'&&a*b<=30)return Array(a).fill(f.repeat(b)).join(' | ');
  if(op==='div'&&a<=30)return f.repeat(a)+'  ➜ groups of '+b;
  return'';
}
function makeOptions(a,b){
  const sp=ans<30?6:ans<150?10:ans<600?30:100;
  const set=new Set([ans]);
  let tries=0;
  while(set.size<4){
    tries++;
    let w=ans+rnd(-sp,sp);
    const r=Math.random();
    if(r<.3&&sp>10)w=ans+(rnd(0,1)?1:-1)*10*rnd(1,9);
    else if(r<.5&&op==='mul')w=pick([ans+a,ans-a,ans+b,ans-b]);
    if(tries>50)w=ans+tries;
    if(w>=0&&w!==ans)set.add(w);
  }
  return[...set].sort(()=>Math.random()-.5);
}
function next(){
  if(q>=TOTAL)return finish();
  q++;locked=false;
  $('qn').textContent=q;$('msg').textContent='';
  const [a,b,r]=OPS[op].levels[cur].gen();
  ans=r;
  $('a').textContent=a;$('b').textContent=b;
  $('apples').textContent=hint(a,b);
  $('opts').innerHTML='';
  makeOptions(a,b).forEach(n=>{const bt=document.createElement('button');bt.className='opt';bt.textContent=n;bt.onclick=()=>choose(bt,n);$('opts').appendChild(bt)});
  startTimer();
}

function startTimer(){
  clearInterval(timer);left=LIMIT;lastTick=-1;updateTime();
  timer=setInterval(()=>{left-=0.1;updateTime();if(left<=0){clearInterval(timer);timeout()}},100);
}
function updateTime(){
  const t=Math.max(0,left);
  $('time').textContent=Math.ceil(t);
  const bar=$('bar');bar.style.width=(t/LIMIT*100)+'%';
  const f=t/LIMIT;if(t<=5&&Math.ceil(t)!==lastTick){lastTick=Math.ceil(t);if(t>0)sfx.tick()}
  bar.style.background=f>.5?'#06d6a0':f>.25?'#ffb703':'#ef476f';
}
function reveal(){[...$('opts').children].forEach(b=>{if(+b.textContent===ans)b.classList.add('right')})}

function choose(btn,n){
  if(locked)return;locked=true;clearInterval(timer);
  if(n===ans){score++;$('score').textContent=score;btn.classList.add('right');$('msg').textContent='🎉 Great job!';$('msg').style.color='#06a077';sfx.correct()}
  else{btn.classList.add('wrong');reveal();$('msg').textContent='😢 Oops! The answer is '+ans;$('msg').style.color='#d62839';sfx.wrong()}
  setTimeout(next,1600);
}
function timeout(){
  if(locked)return;locked=true;reveal();
  $('msg').textContent="⏰ Time's up! Error: no answer in "+LIMIT+" seconds. Answer was "+ans;$('msg').style.color='#d62839';sfx.timeup();
  setTimeout(next,2500);
}

function finish(){
  show('end');
  $('endlv').textContent=OPS[op].icon+' '+OPS[op].name+' · '+LV[cur].icon+' '+LV[cur].name;
  $('final').textContent=score;
  const s=score>=9?3:score>=6?2:score>=3?1:0;sfx.fanfare(s);
  $('stars').textContent='⭐'.repeat(s)+'☆'.repeat(3-s);
  $('trophy').textContent=s===3?'🏆':s===2?'🥈':s===1?'🥉':'🌱';
  $('comment').textContent=['Keep practicing, you can do it! 💪','Good try! 🙂','Great work! 👏','Amazing! You are a math star! 🌟'][s];
}
buildOps();
</script>
</body>
</html>
